  <text x="774" y="177" class="weight">α₁(x)</text><text x="784" y="237" class="weight">α₂(x)</text><text x="798" y="297" class="weight">α₃(x)</text>
  <text x="847" y="580" text-anchor="middle" class="subtitle">input-dependent attention across depth</text>
</svg>
