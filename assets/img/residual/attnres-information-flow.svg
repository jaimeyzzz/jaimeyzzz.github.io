  <path class="flow" stroke-width="1.1" d="M829 168 C780 168 782 338 817 348" marker-end="url(#ar-tip)"/><path class="flow" stroke-width="3.2" d="M829 228 C792 228 792 338 817 348" marker-end="url(#ar-tip)"/><path class="flow" stroke-width="1.8" d="M829 288 C805 288 805 338 817 348" marker-end="url(#ar-tip)"/>
