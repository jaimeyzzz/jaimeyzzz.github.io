<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Attention Residuals information flow</title><desc id="desc">Input-dependent attention weights dynamically select previous depth states for the current token at layer four.</desc>
  <defs>
    <style>.title{font:600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#292521}.subtitle{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#756D66}.section{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5A524C;letter-spacing:.03em}.tick{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#756D66}.active{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#76558F}.neutral{fill:#FFFEFC;stroke:#D8D0C8;stroke-width:1.1}.history{fill:#8DB4C3;stroke:#5E8DA0;stroke-width:1.4}.source{fill:#A993BB;stroke:#76558F;stroke-width:1.4}.target{fill:#C99B78;stroke:#8D6044;stroke-width:1.7}.flow{stroke:#76558F;fill:none;opacity:.84}.sequence{stroke:#5E8DA0;stroke-width:1.8;fill:none}.weight{font:italic 11px Georgia,serif;fill:#76558F}</style>
    <rect id="ar-n" class="neutral" width="36" height="36" rx="7"/><rect id="ar-h" class="history" width="36" height="36" rx="7"/><rect id="ar-s" class="source" width="36" height="36" rx="7"/><rect id="ar-t" class="target" width="42" height="42" rx="8"/><marker id="ar-tip" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#76558F"/></marker><marker id="ar-seq-tip" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5E8DA0"/></marker>
  </defs>
  <rect width="1080" height="620" fill="#FAF7F2"/><text x="56" y="48" class="title">Attention Residuals: Dynamic Depth Mixing</text><text x="56" y="72" class="subtitle">Attention recomputes the depth weights from the current content.</text>
  <rect x="178" y="108" width="590" height="402" rx="16" fill="#F3F0EB"/><rect x="796" y="108" width="102" height="402" rx="16" fill="#F1EBF4"/>
  <text x="473" y="134" text-anchor="middle" class="section">SEQUENCE HISTORY</text><text x="847" y="134" text-anchor="middle" class="section">CURRENT TOKEN</text>
  <g text-anchor="end"><text x="150" y="174" class="tick">Layer 1</text><text x="150" y="234" class="tick">Layer 2</text><text x="150" y="294" class="tick">Layer 3</text><text x="150" y="354" class="active">Layer 4</text><text x="150" y="414" class="tick">Layer 5</text><text x="150" y="474" class="tick">Layer 6</text></g>
  <g class="tick" text-anchor="middle"><text x="250" y="540">t−3</text><text x="386" y="540">t−2</text><text x="522" y="540">t−1</text><text x="658" y="540">t</text><text x="847" y="540">t+1</text></g>
