name: Sync post discussions

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "scripts/sync_github_discussions.py"
      - ".github/workflows/sync-post-discussions.yml"
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing post discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_github_discussions.py
